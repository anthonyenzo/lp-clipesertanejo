name: Publicar na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build e deploy via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      HOSTINGER_BUILD: "1"
      NEXT_PUBLIC_DEPLOY_BASE_PATH: /pack-de-clipes

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar site estático
        run: pnpm run build:hostinger

      - name: Conferir arquivos antes do envio
        run: test -f out/index.html && test -d out/_next

      - name: Publicar somente /pack-de-clipes/
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .brazhits-pack-de-clipes-sync.json
          dangerous-clean-slate: false
          log-level: minimal
